name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync --python ${{ matrix.python }} python scripts/manuscript/render.py --check
      - run: uv run --no-sync --python ${{ matrix.python }} python scripts/z_generate_manuscript_variables.py --check
      - run: uv run --no-sync --python ${{ matrix.python }} python scripts/check_research.py
      - run: uv run --no-sync --python ${{ matrix.python }} pytest
