# ntqr_llm_personas — manuscript configuration.
# This file is the discovery key: the template/ repo's introspection
# (src/template_template/introspection.py :: discover_projects) treats any
# workspace containing docs/manuscript/config.yaml as a renderable project, and reads
# the testing: block below for its coverage gate. The manuscript itself is a
# GENERATED artifact — every number is injected from outputs/llm/.../summary.json
# by scripts/manuscript/render.py; nothing here is hand-typed.

paper:
  title: "Recovering LLM-Persona Accuracies from Unlabeled Votes"
  version: "1.0.0"
  subtitle: "An algebraic NTQR evaluation study, and why disagreement is not enough"
  date: "2026-06-01"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliations:
      - "Active Inference Institute"
      - "FractAI"
    corresponding: true

publication:
  doi: "10.5281/zenodo.20498699"
  version_doi: "10.5281/zenodo.20498700"
  version_record: "https://zenodo.org/records/20498700"
  journal: "Preprint"
  volume: "1"
  pages: "1-N"
  year: "2026"
  github_repository: "docxology/ntqr_llm"
  repository_url: "https://github.com/docxology/ntqr_llm"

keywords:
  - "algebraic evaluation"
  - "NTQR"
  - "unsupervised evaluation"
  - "evaluation on unlabeled data"
  - "LLM-as-judge"
  - "error-independent evaluation"
  - "ensemble evaluability"
  - "constant classifier"
  - "AI safety warning light"
  - "reproducible research"
  - "answer-key-free recovery"
  - "local large language models"

metadata:
  license: "Apache-2.0"
  language: "en"
  geometry: "margin=0.58in"

render:
  formats:
    pdf: true
    html: true
    slides: false
    docx: false
    epub: false

llm:
  reviews:
    enabled: true
    types:
      - executive_summary
      - quality_review
  translations:
    enabled: false

testing:
  max_test_failures: 0
  max_infra_test_failures: 3
  max_project_test_failures: 0
